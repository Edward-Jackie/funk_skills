<!doctype html>
<html lang="zh-CN" data-theme="current" data-motion="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codemap Explorer</title>
  <style>
    :root,
    [data-theme="current"] {
      color-scheme: dark;
      --bg: #0b1226;
      --panel: #121d39;
      --raised: #18294a;
      --hover: #223458;
      --text: #f1f5ff;
      --secondary: #b6c4dc;
      --muted: #8a9bbc;
      --border: #2b3d64;
      --accent: #d7ff63;
      --accent-soft: rgba(215, 255, 99, .13);
      --warning: #ffbd57;
      --danger: #ff7c88;
      --blue: #72bfff;
      --purple: #b7a5ff;
      --edge-sync: #6f8fd0;
      --edge-write: #55d4f2;
      --edge-read: #b9a5ff;
      --edge-async: #ffbd57;
      --edge-schedule: #ff9f67;
      --edge-compensate: #ff7c88;
      --edge-transition: #d7ff63;
      --grid-minor: rgba(122, 151, 210, .12);
      --grid-major: rgba(122, 151, 210, .2);
      --shadow: 0 20px 60px rgba(0, 0, 0, .42);
      --radius: 12px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: Menlo, Monaco, Consolas, monospace;
    }
    [data-theme="blueprint"] {
      color-scheme: light;
      --bg: #e9e4d9;
      --panel: #faf8f1;
      --raised: #fffdf7;
      --hover: #f1e8da;
      --text: #242826;
      --secondary: #5d666a;
      --muted: #7e8585;
      --border: #d0cbc1;
      --accent: #bd4f36;
      --accent-soft: rgba(189, 79, 54, .13);
      --warning: #c9892e;
      --danger: #c45952;
      --blue: #4f6fa6;
      --purple: #7889a7;
      --edge-sync: #416fa8;
      --edge-write: #2e8a9a;
      --edge-read: #6c5aa0;
      --edge-async: #b06a16;
      --edge-schedule: #b25d3c;
      --edge-compensate: #b64545;
      --edge-transition: #bd4f36;
      --grid-minor: rgba(77, 90, 96, .1);
      --grid-major: rgba(77, 90, 96, .17);
      --shadow: 0 20px 60px rgba(52, 58, 54, .12);
    }
    [data-theme="industrial"] {
      color-scheme: dark;
      --bg: #1b2430;
      --panel: #26313d;
      --raised: #33424c;
      --hover: #3b4e5b;
      --text: #f6f2e9;
      --secondary: #c2ccd1;
      --muted: #aeb8c0;
      --border: #485b68;
      --accent: #ffbd57;
      --accent-soft: rgba(255, 189, 87, .14);
      --warning: #8fc2c5;
      --danger: #ff6f7f;
      --blue: #8fc2c5;
      --purple: #bda8f0;
      --edge-sync: #89acd0;
      --edge-write: #69d4da;
      --edge-read: #bba9ee;
      --edge-async: #ffcf6e;
      --edge-schedule: #ff9d76;
      --edge-compensate: #ff7f8f;
      --edge-transition: #ffbd57;
      --grid-minor: rgba(142, 161, 175, .12);
      --grid-major: rgba(142, 161, 175, .2);
      --shadow: 0 20px 60px rgba(8, 16, 24, .45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { display: grid; grid-template-rows: 58px minmax(0, 1fr); height: 100dvh; background: radial-gradient(circle at 65% -20%, var(--accent-soft), transparent 32%), var(--bg); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { display: grid; width: 29px; height: 29px; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border)); border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: 600 11px var(--mono); }
    .brand h1 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font: 10px var(--mono); }
    .actions, .tool-row, .segmented, .filters { display: flex; align-items: center; gap: 7px; }
    .theme-picker { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: color-mix(in srgb, var(--panel) 92%, transparent); }
    .theme-choice { min-height: 26px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease); }
    .theme-choice:hover, .theme-choice.active { background: var(--accent-soft); color: var(--accent); }
    .button, .chip { min-height: 32px; padding: 0 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); color: var(--secondary); font-size: 12px; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease); }
    .button:hover, .chip:hover { background: var(--hover); color: var(--text); border-color: color-mix(in srgb, var(--accent) 28%, var(--border)); }
    .button:active, .chip:active { transform: translateY(1px); }
    .button.active, .chip.active { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 48%, var(--border)); }
    .button:disabled { opacity: .42; cursor: not-allowed; }
    .shell { display: grid; grid-template-columns: 286px minmax(0, 1fr) 400px; min-height: 0; }
    .sidebar, .inspector { min-height: 0; overflow: auto; background: color-mix(in srgb, var(--panel) 96%, transparent); }
    .sidebar { padding: 16px 12px; border-right: 1px solid var(--border); }
    .inspector { padding: 17px; border-left: 1px solid var(--border); }
    .search { width: 100%; height: 36px; padding: 0 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font-size: 12px; }
    .search::placeholder { color: var(--muted); }
    .nav-toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
    .nav-toolbar button { min-height: 28px; padding: 0 5px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
    .nav-toolbar button:hover { border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); color: var(--accent); background: var(--accent-soft); }
    .section-title { margin: 18px 8px 8px; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .graph-list { display: grid; gap: 12px; }
    .nav-domain { display: grid; gap: 4px; }
    .nav-domain-toggle, .nav-view-toggle { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .nav-domain-toggle { padding: 7px 8px; border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 700; }
    .nav-domain-toggle:hover, .nav-view-toggle:hover { background: var(--hover); }
    .nav-domain-toggle .nav-caret, .nav-view-toggle .nav-caret { width: 10px; color: var(--muted); font: 11px var(--mono); transition: transform .2s var(--ease); }
    .nav-domain-toggle .nav-count, .nav-view-toggle .nav-count { margin-left: auto; color: var(--muted); font: 9px var(--mono); }
    .nav-domain-body { display: grid; gap: 7px; padding-left: 10px; }
    .nav-domain.collapsed .nav-domain-body { display: none; }
    .nav-domain.collapsed .nav-domain-toggle .nav-caret, .nav-view.collapsed .nav-view-toggle .nav-caret { transform: rotate(-90deg); }
    .nav-view { display: grid; gap: 3px; }
    .nav-view-toggle { padding: 4px 8px; color: var(--muted); font: 9px var(--mono); letter-spacing: .04em; }
    .nav-view-body { display: grid; gap: 3px; }
    .nav-view.collapsed .nav-view-body { display: none; }
    .graph-item { width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--secondary); text-align: left; cursor: pointer; }
    .graph-item:hover { background: var(--hover); color: var(--text); }
    .graph-item.active { background: var(--accent-soft); color: var(--accent); }
    .graph-item.detail { padding-left: 20px; }
    .graph-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; overflow: hidden; font-size: 12px; font-weight: 600; }
    .graph-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .level-badge { flex: 0 0 auto; padding: 2px 5px; border: 1px solid var(--border); border-radius: 99px; color: var(--muted); font: 8px var(--mono); }
    .graph-item.active .level-badge { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); color: var(--accent); }
    .graph-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font: 9px var(--mono); }
    .legend { display: grid; gap: 8px; margin: 0 8px; color: var(--secondary); font-size: 11px; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .dot.modify { background: var(--warning); }
    .dot.risk { background: var(--danger); }
    .dot.remove { border: 1px dashed var(--danger); background: transparent; }
    .workspace { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .toolbar { position: absolute; z-index: 5; top: 14px; left: 14px; right: 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
    .toolbar > * { pointer-events: auto; }
    .tool-stack { display: grid; gap: 8px; }
    .breadcrumb { padding: 0 4px; color: var(--muted); font: 10px/1.4 var(--mono); }
    .breadcrumb strong { color: var(--text); font-weight: 600; }
    .tool-row { padding: 5px; border: 1px solid var(--border); border-radius: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .chip { min-height: 27px; padding: 0 9px; border-radius: 7px; background: transparent; font-size: 10px; }
    .summary-card { max-width: 340px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .summary-card strong { display: block; font-size: 12px; }
    .summary-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    #canvas { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; }
    #canvas.grabbing { cursor: grabbing; }
    .grid-line { stroke: var(--border); stroke-width: .5; opacity: .28; }
    .canvas-grid { fill: url(#canvas-grid-pattern); pointer-events: none; }
    .grid-minor { stroke: var(--grid-minor); stroke-width: 1; }
    .grid-major { stroke: var(--grid-major); stroke-width: 1.25; fill: none; }
    .lane-box { fill: color-mix(in srgb, var(--panel) 66%, transparent); stroke: var(--border); stroke-width: 1; }
    .lane-label { fill: var(--muted); font: 600 11px var(--mono); letter-spacing: .05em; }
    .edge { fill: none; stroke: var(--edge-sync); stroke-width: 2.15; stroke-linecap: round; stroke-linejoin: round; opacity: 1; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-sync) 54%, transparent)); pointer-events: none; transition: opacity .2s var(--ease), stroke .2s var(--ease), stroke-width .2s var(--ease), filter .2s var(--ease); }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
    .edge.async, .edge.schedule, .edge.compensate { stroke-dasharray: 5 6; animation: edge-flow 2.8s linear infinite; }
    .edge.sync, .edge.depends-on { stroke: var(--edge-sync); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-sync) 54%, transparent)); }
    .edge.write { stroke: var(--edge-write); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-write) 54%, transparent)); animation: edge-flow 3.6s linear infinite; }
    .edge.read { stroke: var(--edge-read); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-read) 54%, transparent)); }
    .edge.async { stroke: var(--edge-async); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-async) 54%, transparent)); }
    .edge.schedule { stroke: var(--edge-schedule); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-schedule) 54%, transparent)); }
    .edge.compensate { stroke: var(--edge-compensate); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-compensate) 54%, transparent)); }
    .edge.transition { stroke: var(--edge-transition); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-transition) 54%, transparent)); }
    .edge.overlay-add, .edge.overlay-modify, .edge.overlay-risk { stroke: var(--accent); stroke-width: 2.2; }
    .edge.overlay-remove { stroke: var(--accent); stroke-dasharray: 5 4; opacity: 1; }
    .node { cursor: pointer; transition: opacity .2s var(--ease); }
    .node rect, .node circle { fill: var(--raised); stroke: var(--border); stroke-width: 1.2; transition: fill .2s var(--ease), stroke .2s var(--ease), filter .2s var(--ease); }
    .node:hover rect, .node:hover circle, .node.selected rect, .node.selected circle { fill: var(--hover); stroke: var(--accent); filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .22)); }
    .node text { fill: var(--text); font: 600 11px var(--sans); pointer-events: none; }
    .node .node-kind { fill: var(--muted); font: 8px var(--mono); letter-spacing: .04em; }
    .node-drill-dot { fill: var(--accent); stroke: var(--raised); stroke-width: 2; pointer-events: none; }
    .node.overlay-add rect, .node.overlay-add circle { stroke: var(--accent); stroke-width: 2; }
    .node.overlay-modify rect, .node.overlay-modify circle { stroke: var(--warning); stroke-width: 2; }
    .node.overlay-risk rect, .node.overlay-risk circle { stroke: var(--danger); stroke-width: 2; }
    .node.overlay-remove { opacity: .46; }
    .node.overlay-remove rect, .node.overlay-remove circle { stroke: var(--danger); stroke-dasharray: 5 4; }
    .node.context-only, .edge.context-only { opacity: .34; }
    .node.dimmed, .edge.dimmed { opacity: .1; }
    #viewport.has-hover-focus .node:not(.hover-related) { opacity: .14; }
    #viewport.has-hover-focus [data-edge]:not(.hover-related) .edge { opacity: .12; }
    #viewport.has-hover-focus .node.hover-related,
    #viewport.has-hover-focus [data-edge].hover-related .edge { opacity: 1; }
    .edge.highlighted, .edge.hovered { stroke: var(--accent); stroke-width: 2.7; opacity: 1; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 48%, transparent)); }
    .edge.compensate.highlighted, .edge.compensate.hovered { stroke: var(--edge-compensate); }
    .node.endpoint rect, .node.endpoint circle { stroke: color-mix(in srgb, var(--accent) 72%, var(--border)); }
    .empty { display: grid; height: 100%; place-items: center; color: var(--muted); font-size: 12px; }
    .eyebrow { color: var(--accent); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .inspector h2 { margin: 8px 0 6px; font-size: 18px; letter-spacing: -.02em; }
    .inspector .lead { margin: 0 0 16px; color: var(--secondary); font-size: 12px; line-height: 1.6; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .badge { padding: 4px 7px; border: 1px solid var(--border); border-radius: 99px; background: var(--raised); color: var(--secondary); font: 9px var(--mono); }
    .badge.accent { border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); color: var(--accent); }
    .info-section { padding: 14px 0; border-top: 1px solid var(--border); }
    .info-section h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 9px; color: var(--muted); font: 10px var(--mono); letter-spacing: .07em; text-transform: uppercase; }
    .section-count { color: var(--accent); font: 10px var(--mono); }
    .info-section p { margin: 0; color: var(--secondary); font-size: 11px; line-height: 1.6; }
    .ref-list { display: grid; gap: 7px; }
    .ref { display: block; padding: 8px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--secondary); font: 9px/1.45 var(--mono); text-decoration: none; word-break: break-all; }
    .ref:hover { border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); color: var(--accent); }
    .relation-list { display: grid; gap: 7px; }
    .relation-item { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--secondary); text-align: left; cursor: pointer; transition: background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease); }
    .relation-item:hover, .relation-item.active { border-color: color-mix(in srgb, var(--accent) 48%, var(--border)); background: var(--hover); color: var(--text); }
    .relation-item:active { transform: translateY(1px); }
    .relation-route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 7px; font-size: 11px; font-weight: 600; }
    .relation-route span:first-child { text-align: right; }
    .relation-route span:last-child { text-align: left; }
    .relation-arrow { color: var(--accent); font: 10px var(--mono); }
    .relation-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font: 9px/1.4 var(--mono); }
    .relation-meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .relation-kind { color: var(--accent); }
    .relation-condition { margin-top: 6px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .hierarchy-card { display: grid; gap: 9px; margin: 2px 0 2px; padding: 12px; border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border)); border-radius: 10px; background: linear-gradient(135deg, var(--accent-soft), var(--raised)); }
    .hierarchy-label { color: var(--muted); font: 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .hierarchy-path { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; color: var(--text); font-size: 11px; line-height: 1.4; }
    .hierarchy-path span:last-child { color: var(--accent); font-weight: 700; }
    .hierarchy-sep { color: var(--muted); font: 12px var(--mono); }
    .stage-track { height: 5px; overflow: hidden; border-radius: 99px; background: var(--border); }
    .stage-track span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .stage-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font: 9px var(--mono); }
    .drill-button { width: 100%; margin: 0 0 2px; }
    .edge-condition { padding: 10px 11px; border-left: 2px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--accent-soft); color: var(--secondary); font-size: 11px; line-height: 1.6; }
    .node-jump-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .node-jump { min-width: 0; min-height: 42px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--secondary); font-size: 10px; cursor: pointer; }
    .node-jump:hover { border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); color: var(--accent); }
    .hint { color: var(--muted); font-size: 11px; line-height: 1.6; }
    .status-current { color: var(--accent); }
    .status-needs-review, .status-stale { color: var(--warning); }
    .status-conflict { color: var(--danger); }
    @keyframes edge-flow { to { stroke-dashoffset: -22; } }
    .edge.compensate { animation: edge-flow 2.2s linear infinite; }
    [data-motion="off"] .edge,
    [data-motion="off"] .edge.compensate { animation: none; }
    @media (max-width: 1120px) { .shell { grid-template-columns: 250px minmax(0, 1fr) 350px; } }
    @media (max-width: 820px) { .shell { grid-template-columns: 180px minmax(0, 1fr); } .inspector { display: none; } .summary-card { display: none; } }
    @media (max-width: 600px) { .shell { grid-template-columns: minmax(0, 1fr); } .sidebar { display: none; } .brand p { display: none; } .filters { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CM</div>
        <div><h1>Codemap Explorer</h1><p id="projectMeta">本地业务知识图谱</p></div>
      </div>
      <div class="actions">
        <div class="theme-picker" id="themePicker" role="group" aria-label="主题选择">
          <button class="theme-choice" data-theme-choice="blueprint" type="button">01 墨纸</button>
          <button class="theme-choice active" data-theme-choice="current" type="button">02 深海</button>
          <button class="theme-choice" data-theme-choice="industrial" type="button">03 赤轨</button>
        </div>
        <button class="button" id="motionToggle" aria-label="切换关系线动效">暂停动效</button>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <input class="search" id="search" placeholder="搜索图、节点、标签…">
        <div class="nav-toolbar" aria-label="导航折叠操作">
          <button id="expandCurrent" type="button">展开当前</button>
          <button id="collapseAll" type="button">全部收起</button>
          <button id="expandAll" type="button">全部展开</button>
        </div>
        <div class="section-title">业务图</div>
        <div class="graph-list" id="graphList"></div>
        <div class="section-title">需求图例</div>

        const endpointClass = selectedEdge && (node.id === selectedEdge.from || node.id === selectedEdge.to) ? "endpoint" : "";
        const overlayClass = node._overlay ? `overlay-${node._overlay}` : "";
        const drillMarker = node.sub ? `<circle class="node-drill-dot" cx="66" cy="-21" r="4"><title>可继续下钻</title></circle>` : "";
        const shape = node.kind === "state" || node.kind === "entry" || node.kind === "terminal" ? `<rect x="-75" y="-29" width="150" height="58" rx="29"></rect>` : node.kind === "decision" ? `<rect x="-58" y="-34" width="116" height="68" rx="12" transform="rotate(45)"></rect>` : `<rect x="-80" y="-34" width="160" height="68" rx="11"></rect>`;
        return `<g class="node ${selectedClass} ${endpointClass} ${overlayClass} ${node._contextOnly ? "context-only" : ""} ${(searchDim || focusDim) ? "dimmed" : ""}" data-node="${esc(node.id)}" transform="translate(${node.x} ${node.y})">${shape}${drillMarker}<text text-anchor="middle" y="-2">${esc(node.label.length > 20 ? node.label.slice(0, 19) + "…" : node.label)}</text><text class="node-kind" text-anchor="middle" y="15">${esc(KIND_NAMES[node.kind] || node.kind)}</text></g>`;
      }).join("");
      const gridPadding = 300;
      const gridSvg = `<rect class="canvas-grid" x="${state.bounds.minX - gridPadding}" y="${state.bounds.minY - gridPadding}" width="${state.bounds.maxX - state.bounds.minX + gridPadding * 2}" height="${state.bounds.maxY - state.bounds.minY + gridPadding * 2}"></rect>`;
      viewport.innerHTML = gridSvg + laneSvg + edgeSvg + nodeSvg;
      applyTransform();
      viewport.querySelectorAll("[data-node]").forEach(node => {
        node.addEventListener("mouseenter", () => applyHoverFocus(graph, "node", node.dataset.node));
        node.addEventListener("mouseleave", clearHoverFocus);
        node.addEventListener("click", event => { event.stopPropagation(); state.selected = node.dataset.node; state.selectedEdge = null; renderCanvas(graph); renderInspector(graph); });
      });
      viewport.querySelectorAll("[data-edge]").forEach(group => {
        const visible = group.querySelector(".edge");
        group.addEventListener("mouseenter", () => { applyHoverFocus(graph, "edge", group.dataset.edge); renderInspector(graph, group.dataset.edge); });
        group.addEventListener("mouseleave", () => { clearHoverFocus(); renderInspector(graph); });
        group.addEventListener("focus", () => { applyHoverFocus(graph, "edge", group.dataset.edge); renderInspector(graph, group.dataset.edge); });
        group.addEventListener("blur", () => { clearHoverFocus(); renderInspector(graph); });
        group.addEventListener("click", event => { event.stopPropagation(); state.selected = null; state.selectedEdge = group.dataset.edge; renderCanvas(graph); renderInspector(graph); });
        group.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); state.selected = null; state.selectedEdge = group.dataset.edge; renderCanvas(graph); renderInspector(graph); } });
      });
      renderFilters(graph);
    }
    function refsMarkup(refs, emptyText = "没有源码锚点") {
      return (refs || []).map(ref => `<a class="ref" href="${esc(DATA.root_href)}/${esc(ref.path)}">${esc(ref.path)}${ref.symbol ? `<br>↳ ${esc(ref.symbol)}` : ""}</a>`).join("") || `<p class="hint">${esc(emptyText)}</p>`;
    }
    function selectInspectorEdge(graph, edgeId) {
      state.selected = null;
      state.selectedEdge = edgeId;
      renderCanvas(graph);
      renderInspector(graph);
    }
    function bindInspectorActions(graph) {
      inspector.querySelectorAll("[data-inspector-edge]").forEach(button => button.addEventListener("click", () => selectInspectorEdge(graph, button.dataset.inspectorEdge)));
      inspector.querySelectorAll("[data-node-jump]").forEach(button => button.addEventListener("click", () => { state.selected = button.dataset.nodeJump; state.selectedEdge = null; renderCanvas(graph); renderInspector(graph); }));
    }
    function renderInspector(graph, previewEdgeId = null) {
      const activeEdgeId = previewEdgeId || state.selectedEdge;
      const edge = graph.edges.find(item => item.id === activeEdgeId);
      if (edge) {
        const from = graph.nodes.find(item => item.id === edge.from);
        const to = graph.nodes.find(item => item.id === edge.to);
        const evidence = edge.evidence || {};
        const condition = edge.condition && edge.condition !== "always" ? edge.condition : "始终成立";
        inspector.innerHTML = `<div class="eyebrow">关系详情${previewEdgeId && previewEdgeId !== state.selectedEdge ? " / 悬停预览" : ""}</div><h2>${esc(edge.label || EDGE_NAMES[edge.kind] || "节点关系")}</h2><p class="lead">${esc(from?.label || edge.from)} → ${esc(to?.label || edge.to)}</p><div class="badge-row"><span class="badge accent">${esc(EDGE_NAMES[edge.kind] || edge.kind)}</span>${edge._overlay ? `<span class="badge accent">影响：${esc(edge._overlay)}</span>` : ""}</div><div class="info-section"><h3>触发条件</h3><div class="edge-condition">${esc(condition)}</div></div>${edge.detail ? `<div class="info-section"><h3>补充说明</h3><p>${esc(edge.detail)}</p></div>` : ""}${edge._reason ? `<div class="info-section"><h3>需求影响</h3><p>${esc(edge._reason)}</p></div>` : ""}<div class="info-section"><h3>关联节点</h3><div class="node-jump-row"><button class="node-jump" data-node-jump="${esc(edge.from)}">来源<br><strong>${esc(from?.label || edge.from)}</strong></button><button class="node-jump" data-node-jump="${esc(edge.to)}">目标<br><strong>${esc(to?.label || edge.to)}</strong></button></div></div><div class="info-section"><h3>证据</h3><p><strong>${esc(evidence.level || "unknown")}</strong><br>${esc(evidence.note || "无说明")}</p></div><div class="info-section"><h3>源码锚点</h3><div class="ref-list">${refsMarkup(edge.refs)}</div></div>`;
        bindInspectorActions(graph);
        return;
      }
      const node = graph.nodes.find(item => item.id === state.selected);
      if (!node) {
        const overlay = activeOverlay();
        if (overlay && state.overlayMode !== "off") {
          const nodeItems = (overlay.nodes || []).filter(item => item.graph === graph.id).map(item => `<button class="relation-item" data-node-jump="${esc(item.id)}"><span class="relation-route"><span>${esc(item.action)}</span><span class="relation-arrow">→</span><span>${esc(item.label || item.id)}</span></span><span class="relation-meta"><span>${esc(item.reason || item.detail || "未说明")}</span><span>节点</span></span></button>`).join("");
          const edgeItems = (overlay.edges || []).filter(item => item.graph === graph.id).map(item => `<button class="relation-item" data-inspector-edge="${esc(item.id)}"><span class="relation-route"><span>${esc(item.from || "-")}</span><span class="relation-arrow">→</span><span>${esc(item.to || "-")}</span></span><span class="relation-meta"><span>${esc(item.reason || item.detail || "未说明")}</span><span>${esc(item.action)}</span></span></button>`).join("");
          inspector.innerHTML = `<div class="eyebrow">需求方案 / ${esc(state.overlayMode === "changes" ? "只看改动" : "改后带上下文")}</div><h2>${esc(overlay.title)}</h2><p class="lead">${esc(overlay.query || "未填写需求说明")}</p><div class="badge-row"><span class="badge accent">${esc(overlay.status)}</span><span class="badge">${esc(graph.title)}</span></div><div class="info-section"><h3>节点改动</h3><div class="relation-list">${nodeItems || '<p class="hint">当前图没有节点改动</p>'}</div></div><div class="info-section"><h3>关系改动</h3><div class="relation-list">${edgeItems || '<p class="hint">当前图没有关系改动</p>'}</div></div><div class="info-section"><h3>使用边界</h3><p>这是尚未实施的方案层，不代表当前代码事实。完成源码与验证后才能提升进基础 Graph。</p></div>`;
          bindInspectorActions(graph);
          return;
        }
        inspector.innerHTML = `<div class="eyebrow">当前图</div><h2>${esc(graph.title)}</h2><p class="lead">${esc(graph.summary || "点击任意节点查看业务说明、证据、上下文与源码锚点。")}</p><div class="info-section"><h3>状态</h3><p class="status-${esc(graph.status)}">${esc(graph.status)} · ${esc(graph.verified_at || "未标日期")}</p></div><div class="info-section"><h3>关系注释</h3><p>画布只保留关系线。悬停或点击连线后，这里显示关系类型、触发条件、补充说明与代码证据。</p></div><div class="info-section"><h3>阅读方式</h3><p>关系探索用于发现连接；业务泳道用于确认跨服务顺序。选中节点后，右侧会列出它的全部入边和出边。</p></div>`;
        return;
      }
      const evidence = node.evidence || {};
      const refs = refsMarkup(node.refs);
      const context = node.context || {};
      const docs = (context.markdown || []).map(item => `<a class="ref" href="${esc(DATA.root_href)}/${esc(item.path)}">${esc(item.path)}<br>↳ ${esc(item.heading)} · ${esc(context.load || "optional")}</a>`).join("") || `<p class="hint">没有额外 Markdown 上下文</p>`;
      const subFile = node.sub ? String(node.sub).split("/").pop() : null;
      const subGraph = subFile ? DATA.graphs.find(item => item._file === subFile) : null;
      const parentGraph = graph.parent?.graph ? DATA.graphs.find(item => item.id === graph.parent.graph) : null;
      const stage = Number(node.level) || 0;
      const stageMax = Math.max(1, ...graph.nodes.map(item => Number(item.level) || 0));
      const progress = Math.min(100, Math.max(0, Math.round(stage / stageMax * 100)));
      const laneLabel = graph.layout.lanes.find(lane => lane.id === node.lane)?.label || node.lane || "流程";
      const upstream = graph.edges.filter(edge => edge.to === node.id);
      const downstream = graph.edges.filter(edge => edge.from === node.id);
      const relationMarkup = edge => {
        const from = graph.nodes.find(item => item.id === edge.from);
        const to = graph.nodes.find(item => item.id === edge.to);
        const summary = edge.label || (edge.condition !== "always" ? edge.condition : EDGE_NAMES[edge.kind] || edge.kind);
        const condition = edge.condition && edge.condition !== "always" ? edge.condition : "始终成立";
        const note = edge.detail ? ` · ${edge.detail}` : "";
        return `<button class="relation-item" data-inspector-edge="${esc(edge.id)}"><span class="relation-route"><span>${esc(from?.label || edge.from)}</span><span class="relation-arrow">→</span><span>${esc(to?.label || edge.to)}</span></span><span class="relation-meta"><span>${esc(summary)}</span><span class="relation-kind">${esc(EDGE_NAMES[edge.kind] || edge.kind)}</span></span><span class="relation-condition">条件：${esc(condition)}${esc(note)}</span></button>`;
      };
      const relationSection = (title, items) => `<div class="info-section"><h3>${title}<span class="section-count">${items.length}</span></h3><div class="relation-list">${items.map(relationMarkup).join("") || `<p class="hint">该节点没有${title}</p>`}</div></div>`;
      const hierarchy = [domainLabel(graph.domain)];
      if (parentGraph) hierarchy.push(parentGraph.title);
      hierarchy.push(graph.title);
      inspector.innerHTML = `<div class="eyebrow">${esc(graph.title)} / ${esc(laneLabel)}</div><h2>${esc(node.label)}</h2><p class="lead">${esc(node.detail || "暂无补充说明")}</p><div class="hierarchy-card"><div class="hierarchy-label">当前层级</div><div class="hierarchy-path">${hierarchy.map((part, index) => `${index ? `<span class="hierarchy-sep">›</span>` : ""}<span>${esc(part)}</span>`).join("")}</div><div class="stage-track"><span style="width:${progress}%"></span></div><div class="stage-meta"><span>阶段 ${stage} / ${stageMax}</span><span>${esc(laneLabel)}</span></div></div><div class="badge-row"><span class="badge accent">${esc(KIND_NAMES[node.kind] || node.kind)}</span>${(node.tags || []).map(tag => `<span class="badge">${esc(tag)}</span>`).join("")}${node._overlay ? `<span class="badge accent">影响：${esc(node._overlay)}</span>` : ""}</div>${subGraph ? `<button class="button active drill-button" id="drillButton">进入${subGraph.level === "summary" ? "领域总览" : "明细图"} · ${esc(subGraph.title)}</button>` : ""}${node._reason ? `<div class="info-section"><h3>需求影响</h3><p>${esc(node._reason)}</p></div>` : ""}${relationSection("上游关系", upstream)}${relationSection("下游关系", downstream)}<div class="info-section"><h3>证据</h3><p><strong>${esc(evidence.level || "unknown")}</strong><br>${esc(evidence.note || "无说明")}</p></div><div class="info-section"><h3>源码锚点</h3><div class="ref-list">${refs}</div></div><div class="info-section"><h3>Markdown 上下文</h3><div class="ref-list">${docs}</div></div>`;
      if (subGraph) document.querySelector("#drillButton").addEventListener("click", () => openGraph(subGraph.id, true, true));
      bindInspectorActions(graph);
    }
    function openGraph(graphId, remember, preserveOverlay = false) {
      if (remember && state.graphId) state.history.push({ graphId: state.graphId, mode: state.mode, activeOverlay: state.activeOverlay, overlayMode: state.overlayMode });
      if (!remember) state.history = [];
      if (!preserveOverlay) { state.activeOverlay = null; state.overlayMode = "off"; }
      state.graphId = graphId;
      state.mode = preferredMode(DATA.graphs.find(graph => graph.id === graphId));
      state.selected = null;
      state.selectedEdge = null;
      state.edgeKinds.clear();
      expandGraphPath(DATA.graphs.find(graph => graph.id === graphId));
      render();
      comfortable();
    }
    function openOverlay(overlayId) {
      const overlay = DATA.overlays.find(item => item.id === overlayId);
      if (!overlay) return;
      state.history = [];
      state.activeOverlay = overlay.id;
      state.overlayMode = "changes";
      state.graphId = overlay.base_graphs?.[0] || state.graphId;
      state.mode = preferredMode(DATA.graphs.find(graph => graph.id === state.graphId));
      state.selected = null;
      state.selectedEdge = null;
      state.edgeKinds.clear();
      expandGraphPath(DATA.graphs.find(graph => graph.id === state.graphId));
      render();
      comfortable();
    }
    function renderBreadcrumb(graph) {
      const overlay = activeOverlay();
      const parent = graph.parent?.graph ? DATA.graphs.find(item => item.id === graph.parent.graph) : null;
      const perspective = graph.kind === "business" || graph.kind === "state" ? "业务视角" : "服务视角";
      const parts = [domainLabel(graph.domain), perspective];
      if (parent) parts.push(parent.title);
      parts.push(graph.title);
      if (overlay) parts.push(overlay.title);
      breadcrumb.innerHTML = parts.map((part, index) => index === parts.length - 1 ? `<strong>${esc(part)}</strong>` : esc(part)).join(" / ");
    }
    function render() {
      const graph = normalizedGraph();
      renderGraphList();
      if (!graph) { viewport.innerHTML = `<foreignObject width="100%" height="100%"><div class="empty">没有可展示的 Graph</div></foreignObject>`; return; }
      renderBreadcrumb(graph);
      document.querySelector("#graphTitle").textContent = graph.title;
      const overlay = activeOverlay();
      const modeLabel = state.overlayMode === "changes" ? "只看改动" : state.overlayMode === "context" ? "改后带上下文" : "当前事实";
      document.querySelector("#graphSummary").textContent = overlay ? `${modeLabel} · ${overlay.query || graph.summary || "需求影响"}` : graph.summary || `${graph.nodes.length} 个节点 · ${graph.edges.length} 条关系`;
      document.querySelector("#projectMeta").textContent = `${DATA.project} · ${new Set(DATA.graphs.map(item => item.domain || "global")).size} 个领域 · ${DATA.graphs.length} 张图`;
      overlayModes.hidden = !overlay;
      document.querySelectorAll("[data-overlay-mode]").forEach(button => button.classList.toggle("active", button.dataset.overlayMode === state.overlayMode));
      backButton.disabled = state.history.length === 0;
      document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === state.mode));
      renderCanvas(graph); renderInspector(graph);
    }
    function applyTransform() { viewport.setAttribute("transform", `translate(${state.tx} ${state.ty}) scale(${state.scale})`); }
    function fit() {
      if (!state.bounds) return;
      const rect = svg.getBoundingClientRect(), bounds = state.bounds;
      const width = Math.max(1, bounds.maxX - bounds.minX), height = Math.max(1, bounds.maxY - bounds.minY);
      const topInset = 128, availableHeight = Math.max(200, rect.height - topInset - 24);
      state.scale = Math.max(.28, Math.min(1, (rect.width - 70) / width, availableHeight / height));
      state.tx = (rect.width - (bounds.minX + bounds.maxX) * state.scale) / 2;
      state.ty = topInset + (availableHeight - (bounds.minY + bounds.maxY) * state.scale) / 2;
      applyTransform();
    }
    function comfortable() {
      if (!state.bounds) return;
      const rect = svg.getBoundingClientRect(), bounds = state.bounds;
      state.scale = .92;
      state.tx = rect.width / 2 - ((bounds.minX + bounds.maxX) / 2) * state.scale;
      state.ty = 122 - bounds.minY * state.scale;
      applyTransform();
    }
    document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => { state.mode = button.dataset.mode; document.querySelectorAll("[data-mode]").forEach(item => item.classList.toggle("active", item === button)); render(); comfortable(); }));
    document.querySelectorAll("[data-overlay-mode]").forEach(button => button.addEventListener("click", () => { state.overlayMode = button.dataset.overlayMode; state.selected = null; state.selectedEdge = null; state.edgeKinds.clear(); render(); comfortable(); }));
    document.querySelector("#fitButton").addEventListener("click", fit);
    backButton.addEventListener("click", () => { const previous = state.history.pop(); if (previous) { state.graphId = previous.graphId || previous; state.mode = previous.mode || preferredMode(DATA.graphs.find(graph => graph.id === state.graphId)); state.activeOverlay = previous.activeOverlay || null; state.overlayMode = previous.overlayMode || "off"; state.selected = null; state.selectedEdge = null; state.edgeKinds.clear(); render(); comfortable(); } });
    expandCurrentButton.addEventListener("click", () => { expandGraphPath(currentGraph()); renderGraphList(); });
    collapseAllButton.addEventListener("click", () => { state.collapsedDomains = new Set(domainIds); state.collapsedViews = new Set(allViewKeys()); saveNavState(); renderGraphList(); });
    expandAllButton.addEventListener("click", () => { state.collapsedDomains.clear(); state.collapsedViews.clear(); saveNavState(); renderGraphList(); });
    search.addEventListener("input", () => { state.query = search.value.trim(); render(); });
    function applyTheme(theme) {
      const legacyTheme = { light: "blueprint", dark: "current" };
      const normalized = legacyTheme[theme] || theme;
      const next = ["blueprint", "current", "industrial"].includes(normalized) ? normalized : "current";
      document.documentElement.dataset.theme = next;
      themePicker.querySelectorAll("[data-theme-choice]").forEach(button => button.classList.toggle("active", button.dataset.themeChoice === next));
      localStorage.setItem("codemap-theme", next);
    }
    themePicker.querySelectorAll("[data-theme-choice]").forEach(button => button.addEventListener("click", () => applyTheme(button.dataset.themeChoice)));
    function applyMotion(enabled) {
      document.documentElement.dataset.motion = enabled ? "on" : "off";
      motionToggle.textContent = enabled ? "暂停动效" : "播放动效";
      motionToggle.classList.toggle("active", !enabled);
      localStorage.setItem("codemap-motion", enabled ? "on" : "off");
    }
    motionToggle.addEventListener("click", () => applyMotion(document.documentElement.dataset.motion !== "on"));
    svg.addEventListener("wheel", event => { event.preventDefault(); const factor = event.deltaY > 0 ? .9 : 1.1, next = Math.max(.35, Math.min(2.4, state.scale * factor)); const rect = svg.getBoundingClientRect(), x = event.clientX - rect.left, y = event.clientY - rect.top; state.tx = x - (x - state.tx) * next / state.scale; state.ty = y - (y - state.ty) * next / state.scale; state.scale = next; applyTransform(); }, { passive: false });
    svg.addEventListener("pointerdown", event => { if (event.target.closest(".node") || event.target.closest("[data-edge]")) return; state.dragging = true; state.last = [event.clientX, event.clientY]; svg.classList.add("grabbing"); svg.setPointerCapture(event.pointerId); });
    svg.addEventListener("pointermove", event => { if (!state.dragging) return; state.tx += event.clientX - state.last[0]; state.ty += event.clientY - state.last[1]; state.last = [event.clientX, event.clientY]; applyTransform(); });
    svg.addEventListener("pointerup", () => { state.dragging = false; svg.classList.remove("grabbing"); });
    svg.addEventListener("click", event => { if (event.target === svg || event.target === viewport) { state.selected = null; state.selectedEdge = null; const graph = normalizedGraph(); renderCanvas(graph); renderInspector(graph); } });
    window.addEventListener("resize", () => { render(); comfortable(); });
    applyTheme(localStorage.getItem("codemap-theme") || "current");
    applyMotion(localStorage.getItem("codemap-motion") !== "off");
    expandGraphPath(initialGraphData);
    document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === state.mode));
    render();
    comfortable();
  </script>
</body>
