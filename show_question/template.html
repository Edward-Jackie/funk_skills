<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  /* 配色/字体按当前对话的主题调整，这套是默认的中性深色方案 */
  :root {
    --bg: #15181d;
    --surface: #1c2128;
    --surface-2: #232a33;
    --border: #2a323d;
    --accent: #5b8dee;
    --success: #4caf7d;
    --danger: #e06b6b;
    --text: #e8eaed;
    --text-muted: #8a92a0;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    padding: 3.5rem 1.5rem 5rem;
  }

  .page { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 2.2rem; }

  header { display: flex; flex-direction: column; gap: 0.6rem; }

  .kicker {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 { font-size: 1.55rem; margin: 0; text-wrap: balance; font-weight: 650; }

  .dek { margin: 0; color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; max-width: 54ch; }

  /* ===== 进度条 ===== */
  .progress-wrap { display: flex; flex-direction: column; gap: 0.45rem; }
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
  .progress-label { font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); }

  /* ===== 题组 ===== */
  .group { display: flex; flex-direction: column; gap: 1rem; }
  .group-title {
    font-size: 0.82rem; font-weight: 650; color: var(--accent);
    letter-spacing: 0.04em; margin: 0.4rem 0 0;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  fieldset {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem 0.6rem;
    background: var(--surface);
    transition: border-color .2s, opacity .2s;
  }

  fieldset.required-mark { border-right: 3px solid var(--accent); }
  fieldset.has-error { border-color: var(--danger); }
  fieldset[hidden] { display: none; }

  legend { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); padding: 0 0.4rem; }
  legend .req { color: var(--danger); font-weight: 700; }

  .qtitle { font-size: 0.95rem; font-weight: 600; margin: 0 0 0.7rem; line-height: 1.5; }
  .qtitle .req { color: var(--danger); margin-left: 0.2rem; }
  .err-msg { display: none; font-size: 0.78rem; color: var(--danger); margin: 0.45rem 0 0; }
  .has-error .err-msg { display: block; }

  .field { display: flex; flex-direction: column; gap: 0.5rem; }

  input[type="text"], textarea, select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.55rem 0.7rem;
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
    width: 100%;
  }

  input[type="text"]:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .choice-row { display: flex; flex-direction: column; gap: 0.5rem; }
  .choice-row label { display: flex; align-items: center; gap: 0.55rem; font-size: 0.9rem; cursor: pointer; }

  input[type="radio"], input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px; height: 15px;
  }

  .range-row { display: flex; align-items: center; gap: 0.8rem; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .range-val { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); min-width: 2.4em; text-align: right; }

  /* ===== 矩阵评分 ===== */
  .matrix { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .matrix th, .matrix td { padding: 0.45rem 0.35rem; text-align: center; border-bottom: 1px solid var(--border); }
  .matrix th:first-child, .matrix td:first-child { text-align: left; color: var(--text); }
  .matrix th { color: var(--text-muted); font-weight: 600; }
  .matrix input[type="radio"] { width: 14px; height: 14px; }

  /* ===== 更多选项（跳过此题 / 补充说明 / 自己填） ===== */
  details.more { margin-top: 0.8rem; border-top: 1px dashed var(--border); padding-top: 0.7rem; }
  details.more summary { cursor: pointer; font-size: 0.8rem; color: var(--text-muted); list-style: none; user-select: none; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "＋ "; color: var(--accent); }
  details.more[open] summary::before { content: "－ "; }
  .more-body { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.6rem; }
  .more-row { display: flex; align-items: center; gap: 0.55rem; font-size: 0.88rem; }
  .more-row label { display: flex; align-items: center; gap: 0.55rem; cursor: pointer; }
  .more-row.other-input, .more-row.note-input { display: flex; flex-direction: column; align-items: stretch; gap: 0.4rem; }
  .more-row.other-input[hidden] { display: none; }
  .more-row textarea { resize: vertical; min-height: 3.2rem; }

  .hint { font-size: 0.78rem; color: var(--text-muted); margin: 0; }

  .preview { display: flex; flex-direction: column; gap: 0.6rem; }
  .preview h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 0; font-weight: 600; }
  pre { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.55; color: #9fd3a8; overflow-x: auto; white-space: pre; }

  .actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  button { background: var(--accent); color: #0d1420; border: none; border-radius: 8px; padding: 0.7rem 1.3rem; font-size: 0.92rem; font-weight: 650; font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button:active { transform: translateY(1px); }
  button.secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

  .status { font-size: 0.85rem; color: var(--text-muted); }
  .status.done { color: var(--success); }
  .status.error { color: var(--danger); }

  footer { border-top: 1px solid var(--border); padding-top: 1.2rem; font-size: 0.82rem; color: var(--text-muted); line-height: 1.65; }
  footer code { font-family: var(--font-mono); color: var(--accent); }
</style>
</head>
<body>
<div class="page">

  <header>
    <span class="kicker">{{KICKER}}</span>
    <h1>{{TITLE}}</h1>
    <p class="dek">{{DEK}}</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 题 · 0%</div>
  </div>

  <!-- 表单体由生成器按配置注入 -->
  <form id="surveyForm">
{{FORM_FIELDS}}
  </form>

  <div class="preview">
    <h2>实时预览 · 这就是会被复制的内容</h2>
    <pre id="jsonPreview"></pre>
  </div>

  <div class="actions">
    <button type="button" id="copyBtn">一键复制 JSON</button>
    <button type="button" id="downloadBtn" class="secondary">改成下载文件</button>
    <span class="status" id="status"></span>
  </div>

  <footer>
    复制用的是浏览器原生剪贴板 API，跟下载一样不经过任何网络请求，CSP 挡不住。
    复制完直接粘贴发回聊天框就行，不用额外说明。
    每题展开「更多选项」可跳过此题或补充说明；带「其他」的题还能自己填。
    带 <code>*</code> 的题为必填，没填完会提示。
  </footer>

</div>

<script>
  // ===== 通用收集：遍历所有 fieldset，按 data-type 取值，JS 无需按题手写 =====
  function collectAnswers() {
    var answers = {};
    hideConditional(); // 先按条件逻辑显隐，避免收集隐藏题
    var fieldsets = document.querySelectorAll('#surveyForm fieldset[data-key]');
    fieldsets.forEach(function (fs) {
      if (fs.hidden) return; // 条件逻辑隐藏的题不收集
      var key = fs.dataset.key;
      var type = fs.dataset.type;

      var skipBox = fs.querySelector('[data-skip]');
      var note = noteOf(fs);
      if (skipBox && skipBox.checked) {
        answers[key] = null;
        answers[key + '（跳过）'] = true;
        answers[key + '（补充说明）'] = note;
        return;
      }

      var otherTextEl = fs.querySelector('[data-other-text]');
      var otherText = otherTextEl ? otherTextEl.value.trim() : '';
      var otherUsed = fs.querySelector('[data-other-choice]') !== null && (
        otherText !== '' || (fs.querySelector('[data-other-choice]:checked') !== null)
      );

      var val;
      if (type === 'radio') {
        var picked = fs.querySelector('input[type=radio][data-choice]:checked, input[type=radio][data-other-choice]:checked');
        val = picked ? picked.value : null;
        if (otherUsed && otherText !== '') val = '其他：' + otherText;
      } else if (type === 'checkbox') {
        var picks = fs.querySelectorAll('input[type=checkbox][data-choice]:checked');
        val = [];
        picks.forEach(function (c) { val.push(c.value); });
        if (otherText !== '') val.push('其他：' + otherText);
      } else if (type === 'range') {
        val = fs.querySelector('[data-range]').value;
      } else if (type === 'select') {
        val = fs.querySelector('select').value || null;
      } else if (type === 'matrix') {
        val = {};
        fs.querySelectorAll('[data-matrix-row]').forEach(function (tr) {
          var row = tr.dataset.matrixRow;
          var picked = tr.querySelector('input[type=radio]:checked');
          val[row] = picked ? picked.value : null;
        });
      } else {
        // text / textarea
        var el = fs.querySelector('input[type=text], textarea');
        val = el ? el.value : '';
      }
      answers[key] = val;
      if (note) answers[key + '（补充说明）'] = note;
    });
    answers['生成时间'] = new Date().toISOString();
    return answers;
  }

  function noteOf(fs) { var el = fs.querySelector('[data-note]'); return el ? el.value.trim() : ''; }

  // ===== 必填校验：返回缺失题目键名数组 =====
  function validateRequired() {
    var missing = [];
    document.querySelectorAll('#surveyForm fieldset[data-key][data-required="true"]').forEach(function (fs) {
      if (fs.hidden) return;
      var skipBox = fs.querySelector('[data-skip]');
      if (skipBox && skipBox.checked) return; // 跳过算回答
      var type = fs.dataset.type;
      var ok = false;
      if (type === 'radio' || type === 'select') {
        ok = (fs.querySelector('input:checked, select') && (fs.querySelector('input:checked') || fs.querySelector('select').value));
        if (type === 'select') ok = !!fs.querySelector('select').value;
      } else if (type === 'checkbox') {
        ok = fs.querySelectorAll('input[type=checkbox][data-choice]:checked').length > 0;
      } else if (type === 'range') {
        ok = true;
      } else if (type === 'matrix') {
        ok = Array.from(fs.querySelectorAll('[data-matrix-row]')).every(function (tr) {
          return tr.querySelector('input[type=radio]:checked') !== null;
        });
      } else {
        var el = fs.querySelector('input[type=text], textarea');
        ok = el && el.value.trim() !== '';
      }
      if (!ok) {
        missing.push(fs.dataset.key);
        fs.classList.add('has-error');
      } else {
        fs.classList.remove('has-error');
      }
    });
    return missing;
  }

  // ===== 进度：整体完成度（含非必填）+ 百分比 + 当前第几题/共几题 =====
  function updateProgress() {
    var all = Array.from(document.querySelectorAll('#surveyForm fieldset[data-key]'))
      .filter(function (fs) { return !fs.hidden; });
    var total = all.length;
    var done = all.filter(function (fs) {
      var skipBox = fs.querySelector('[data-skip]');
      if (skipBox && skipBox.checked) return true;
      var type = fs.dataset.type;
      if (type === 'radio' || type === 'matrix') return fs.querySelector('input[type=radio]:checked') !== null;
      if (type === 'select') return !!fs.querySelector('select').value;
      if (type === 'checkbox') return fs.querySelectorAll('input[type=checkbox][data-choice]:checked').length > 0;
      if (type === 'range') return true;
      var el = fs.querySelector('input[type=text], textarea');
      return el && el.value.trim() !== '';
    }).length;
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = done + ' / ' + total + ' 题 · ' + pct + '%';
  }

  // ===== 条件逻辑：data-show-when 依赖的题显隐 =====
  function hideConditional() {
    document.querySelectorAll('#surveyForm fieldset[data-show-when]').forEach(function (fs) {
      var cond = JSON.parse(fs.dataset.showWhen); // [{key, value}]
      var show = cond.every(function (c) {
        var dep = document.querySelector('#surveyForm fieldset[data-key="' + c.key + '"]');
        if (!dep) return true;
        var picked = dep.querySelector('input[type=radio][data-choice]:checked, input[type=radio][data-other-choice]:checked');
        if (picked) return String(picked.value) === String(c.value) || (c.value === '__any' && picked.value === '其他');
        var sel = dep.querySelector('select');
        if (sel) return String(sel.value) === String(c.value);
        return false;
      });
      fs.hidden = !show;
    });
  }

  function refresh() {
    hideConditional();
    document.getElementById('jsonPreview').textContent = JSON.stringify(collectAnswers(), null, 2);
    updateProgress();
  }

  document.getElementById('surveyForm').addEventListener('input', refresh);
  document.getElementById('surveyForm').addEventListener('change', refresh);

  // 滑块实时数值
  document.querySelectorAll('[data-range]').forEach(function (r) {
    r.addEventListener('input', function () {
      var out = r.closest('.range-row').querySelector('[data-range-val]');
      if (out) out.textContent = r.value;
    });
  });

  // 选「其他」时展开自己填输入框
  document.querySelectorAll('[data-other-choice]').forEach(function (c) {
    c.addEventListener('change', function () {
      var fs = c.closest('fieldset');
      var box = fs.querySelector('.more-row.other-input');
      if (box) box.hidden = !(c.checked && c.value === '其他');
    });
  });

  // 复制兜底：file:// 下 navigator.clipboard 可能不可用
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var textarea = document.createElement('textarea');
      textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
      document.body.appendChild(textarea); textarea.focus(); textarea.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(textarea);
      ok ? resolve() : reject(new Error('execCommand copy 失败'));
    });
  }

  document.getElementById('copyBtn').addEventListener('click', function () {
    var missing = validateRequired();
    var status = document.getElementById('status');
    if (missing.length) {
      status.textContent = '还有必填题没填：' + missing.join('、');
      status.classList.remove('done'); status.classList.add('error');
      return;
    }
    var text = JSON.stringify(collectAnswers(), null, 2);
    copyText(text).then(function () {
      status.textContent = '已复制到剪贴板，直接粘贴发给我就行';
      status.classList.remove('error'); status.classList.add('done');
    }).catch(function (err) {
      status.textContent = '复制失败（' + err.message + '），改用旁边"改成下载文件"';
      status.classList.remove('done'); status.classList.add('error');
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    var missing = validateRequired();
    var status = document.getElementById('status');
    if (missing.length) {
      status.textContent = '还有必填题没填：' + missing.join('、');
      status.classList.remove('done'); status.classList.add('error');
      return;
    }
    var data = collectAnswers();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'form-answers.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    status.textContent = '已下载 form-answers.json，去跟我说一声就行';
    status.classList.remove('error'); status.classList.add('done');
  });

  refresh();
</script>
</body>
</html>
