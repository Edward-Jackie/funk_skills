<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{页面标题}}</title>
<style>
  /* 配色/字体按当前对话的主题调整，这套是默认的中性深色方案 */
  :root {
    --bg: #15181d;
    --surface: #1c2128;
    --surface-2: #232a33;
    --border: #2a323d;
    --accent: #5b8dee;
    --success: #4caf7d;
    --text: #e8eaed;
    --text-muted: #8a92a0;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    padding: 3.5rem 1.5rem 5rem;
  }

  .page {
    max-width: 40rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2.2rem;
  }

  header { display: flex; flex-direction: column; gap: 0.6rem; }

  .kicker {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 { font-size: 1.55rem; margin: 0; text-wrap: balance; font-weight: 650; }

  .dek {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.6;
    max-width: 54ch;
  }

  fieldset {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem 1.3rem;
    background: var(--surface);
  }

  fieldset + fieldset { margin-top: 1rem; }

  legend {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 0.4rem;
  }

  .field { display: flex; flex-direction: column; gap: 0.5rem; }

  input[type="text"], textarea {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.55rem 0.7rem;
    color: var(--text);
    font-size: 0.92rem;
    font-family: inherit;
    width: 100%;
  }

  input[type="text"]:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .choice-row { display: flex; flex-direction: column; gap: 0.5rem; }

  .choice-row label {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.9rem;
    cursor: pointer;
  }

  input[type="radio"], input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
  }

  .range-row { display: flex; align-items: center; gap: 0.8rem; }

  input[type="range"] { flex: 1; accent-color: var(--accent); }

  .range-val {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--accent);
    min-width: 2.4em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ===== 更多选项（跳过此题 / 其他自由输入） ===== */
  details.more {
    margin-top: 0.8rem;
    border-top: 1px dashed var(--border);
    padding-top: 0.7rem;
  }

  details.more summary {
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--text-muted);
    list-style: none;
    user-select: none;
  }

  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "＋ "; color: var(--accent); }
  details.more[open] summary::before { content: "－ "; }

  .more-body { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.6rem; }

  .more-row { display: flex; align-items: center; gap: 0.55rem; font-size: 0.88rem; }

  .more-row.other-input { display: flex; flex-direction: column; align-items: stretch; gap: 0.4rem; }
  .more-row.other-input[hidden] { display: none; }

  .more-row label { display: flex; align-items: center; gap: 0.55rem; cursor: pointer; }

  .hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin: 0;
  }

  .preview { display: flex; flex-direction: column; gap: 0.6rem; }

  .preview h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0;
    font-weight: 600;
  }

  pre {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.55;
    color: #9fd3a8;
    overflow-x: auto;
    white-space: pre;
  }

  .actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

  button {
    background: var(--accent);
    color: #0d1420;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1.3rem;
    font-size: 0.92rem;
    font-weight: 650;
    font-family: inherit;
    cursor: pointer;
  }

  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button:active { transform: translateY(1px); }

  button.secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .status { font-size: 0.85rem; color: var(--text-muted); }
  .status.done { color: var(--success); }

  footer {
    border-top: 1px solid var(--border);
    padding-top: 1.2rem;
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.65;
  }

  footer code { font-family: var(--font-mono); color: var(--accent); }
</style>
</head>
<body>
<div class="page">

  <header>
    <span class="kicker">{{一句话说明这是干什么的}}</span>
    <h1>{{标题}}</h1>
    <p class="dek">{{一两句说明：为什么用这个表单收集信息，填完怎么办}}</p>
  </header>

  <!--
    通用字段驱动写法：
    - 每个 fieldset 声明 data-key（键名，用中文）和 data-type（题型）。
    - data-type 支持：text / textarea / radio / checkbox / range
    - 单选/多选想允许"自己填"，加 data-other="true"，并在选项里放一个
      value="其他" 的项（见下方 q2 示例）。
    - 每个 fieldset 都自带「更多选项」：跳过此题必带；其他自由输入仅
      data-other="true" 的题型显示。
    - 新增题只需复制一个 fieldset 改 data 属性和文案，JS 不用动。
  -->
  <form id="surveyForm">

    <!-- 开放式文本：data-type="text"，天然可自由输入 -->
    <fieldset data-key="开放式问题" data-type="text">
      <legend>开放式问题</legend>
      <div class="field">
        <input type="text" placeholder="{{占位提示}}" autocomplete="off">
      </div>
      <details class="more">
        <summary>更多选项</summary>
        <div class="more-body">
          <label class="more-row"><input type="checkbox" data-skip> 跳过此题</label>
        </div>
      </details>
    </fieldset>

    <!-- 单选 + 允许自己填：data-type="radio" data-other="true" -->
    <fieldset data-key="单选问题" data-type="radio" data-other="true">
      <legend>单选问题</legend>
      <div class="choice-row">
        <label><input type="radio" name="q2" value="选项A" data-choice> 选项A</label>
        <label><input type="radio" name="q2" value="选项B" data-choice> 选项B</label>
        <label><input type="radio" name="q2" value="其他" data-other-choice> 其他</label>
      </div>
      <details class="more">
        <summary>更多选项</summary>
        <div class="more-body">
          <label class="more-row"><input type="checkbox" data-skip> 跳过此题</label>
          <div class="more-row other-input" hidden>
            <span>自己填：</span>
            <input type="text" data-other-text placeholder="填你的答案">
          </div>
        </div>
      </details>
    </fieldset>

    <!-- 多选：data-type="checkbox" 也支持 data-other -->
    <fieldset data-key="多选题" data-type="checkbox" data-other="true">
      <legend>多选题</legend>
      <div class="choice-row">
        <label><input type="checkbox" name="q3" value="选项甲" data-choice> 选项甲</label>
        <label><input type="checkbox" name="q3" value="选项乙" data-choice> 选项乙</label>
        <label><input type="checkbox" name="q3" value="其他" data-other-choice> 其他</label>
      </div>
      <details class="more">
        <summary>更多选项</summary>
        <div class="more-body">
          <label class="more-row"><input type="checkbox" data-skip> 跳过此题</label>
          <div class="more-row other-input" hidden>
            <span>自己填：</span>
            <input type="text" data-other-text placeholder="填你的答案">
          </div>
        </div>
      </details>
    </fieldset>

    <!-- 滑块打分：data-type="range"，只保留跳过，不宜自由填 -->
    <fieldset data-key="评分（1-10）" data-type="range">
      <legend>评分（1-10）</legend>
      <div class="range-row">
        <input type="range" min="1" max="10" value="5" data-range>
        <span class="range-val" data-range-val>5</span>
      </div>
      <details class="more">
        <summary>更多选项</summary>
        <div class="more-body">
          <label class="more-row"><input type="checkbox" data-skip> 跳过此题</label>
        </div>
      </details>
    </fieldset>

  </form>

  <div class="preview">
    <h2>实时预览 · 这就是会被复制的内容</h2>
    <pre id="jsonPreview"></pre>
  </div>

  <div class="actions">
    <button type="button" id="copyBtn">一键复制 JSON</button>
    <button type="button" id="downloadBtn" class="secondary">改成下载文件</button>
    <span class="status" id="status"></span>
  </div>

  <footer>
    复制用的是浏览器原生剪贴板 API，跟下载一样不经过任何网络请求，CSP 挡不住。
    复制完直接粘贴发回聊天框就行，不用额外说明。
    每题展开「更多选项」可跳过此题；带「其他」的单选题还能自己填答案。
  </footer>

</div>

<script>
  // ===== 通用收集：遍历所有 fieldset，按 data-type 取值，JS 无需按题手写 =====
  function collectAnswers() {
    var answers = {};
    var fieldsets = document.querySelectorAll('#surveyForm fieldset[data-key]');
    fieldsets.forEach(function (fs) {
      var key = fs.dataset.key;
      var type = fs.dataset.type;

      // 跳过此题：键记为 null，另加一个"（跳过）"标记
      var skipBox = fs.querySelector('[data-skip]');
      if (skipBox && skipBox.checked) {
        answers[key] = null;
        answers[key + '（跳过）'] = true;
        return;
      }

      // 其他自由输入：取文本，选中"其他"选项或填了字都算
      var otherTextEl = fs.querySelector('[data-other-text]');
      var otherText = otherTextEl ? otherTextEl.value.trim() : '';
      var otherUsed = fs.querySelector('[data-other-choice]') !== null && (
        otherText !== '' ||
        (fs.querySelector('[data-other-choice]:checked') !== null)
      );

      var val;
      if (type === 'radio') {
        var picked = fs.querySelector('input[type=radio][data-choice]:checked, input[type=radio][data-other-choice]:checked');
        val = picked ? picked.value : null;
        if (otherUsed && otherText !== '') val = '其他：' + otherText;
      } else if (type === 'checkbox') {
        var picks = fs.querySelectorAll('input[type=checkbox]:checked');
        val = [];
        picks.forEach(function (c) { val.push(c.value); });
        if (otherText !== '') val.push('其他：' + otherText);
      } else if (type === 'range') {
        val = fs.querySelector('[data-range]').value;
      } else {
        // text / textarea
        var el = fs.querySelector('input[type=text], textarea');
        val = el ? el.value : '';
      }
      answers[key] = val;
    });
    answers['生成时间'] = new Date().toISOString();
    return answers;
  }

  function updatePreview() {
    document.getElementById('jsonPreview').textContent =
      JSON.stringify(collectAnswers(), null, 2);
  }

  document.getElementById('surveyForm').addEventListener('input', updatePreview);
  updatePreview();

  // 滑块的实时数值显示
  document.querySelectorAll('[data-range]').forEach(function (r) {
    r.addEventListener('input', function () {
      var out = r.closest('.range-row').querySelector('[data-range-val]');
      if (out) out.textContent = r.value;
    });
  });

  // 选了「其他」选项时，展开并显示"自己填"输入框
  document.querySelectorAll('[data-other-choice]').forEach(function (c) {
    c.addEventListener('change', function () {
      var fs = c.closest('fieldset');
      var box = fs.querySelector('.more-row.other-input');
      if (box) box.hidden = !(c.checked && c.value === '其他');
    });
  });

  // 兜底方案：本地 file:// 页面里 navigator.clipboard 不一定能用，
  // 用不了就退回到老办法——建一个临时 textarea，选中内容后调用 execCommand('copy')
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(textarea);
      ok ? resolve() : reject(new Error('execCommand copy 失败'));
    });
  }

  document.getElementById('copyBtn').addEventListener('click', function () {
    var text = JSON.stringify(collectAnswers(), null, 2);
    var status = document.getElementById('status');
    copyText(text).then(function () {
      status.textContent = '已复制到剪贴板，直接粘贴发给我就行';
      status.classList.add('done');
    }).catch(function (err) {
      status.textContent = '复制失败（' + err.message + '），改用旁边"改成下载文件"';
      status.classList.remove('done');
    });
  });

  // 下载兜底：复制万一被浏览器拦了，还能存文件让我用 Read 工具读
  document.getElementById('downloadBtn').addEventListener('click', function () {
    var data = collectAnswers();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'claude-form-answers.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    var status = document.getElementById('status');
    status.textContent = '已下载 claude-form-answers.json，去跟我说一声就行';
    status.classList.add('done');
  });
</script>
</body>
</html>
